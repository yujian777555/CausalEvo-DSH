# DeepSeek Harness profile patch for the Phase 0 cache benchmark.
# Applied after the `sdk` profile layer via `--patch`.
# Goal: the benchmark agent has NO callable tools, NO shell, NO filesystem
# access, NO web access, NO subagents, and NO telemetry/session-log upload.
# Keeping the plugin list explicit (rather than relying on prompt text like
# "do not use tools") is the actual isolation mechanism (plan P0.2 / gate G3).

# --- shells / execution ---
- id: tool-pwsh
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-jobs
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: bash-sandbox
  disabled: true
- id: sandbox
  disabled: true
- id: sandbox-policy
  disabled: true
- id: subprocess
  disabled: true
# - id: shell-env  (kept: dsh-permission-presets waits for the "shell" service
#                   it provides; it registers no tool for the model)

# --- filesystem ---
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: fs-sandbox
  disabled: true
- id: fs-observation-policy
  disabled: true
- id: attachment-local
  disabled: true
- id: agent-instructions
  disabled: true

# --- web ---
- id: tool-web
  disabled: true
- id: web
  disabled: true
- id: web-search-deepseek
  disabled: true
- id: web-fetch-http
  disabled: true

# --- skills / commands / goals / plans ---
- id: skill
  disabled: true
- id: skill-filesystem
  disabled: true
- id: skill-badge
  disabled: true
- id: tool-skill
  disabled: true
- id: commands
  disabled: true
- id: command-feedback
  disabled: true
- id: command-compact
  disabled: true
- id: goal
  disabled: true
- id: goal-round-driver
  disabled: true
- id: command-goal
  disabled: true
- id: tool-goal
  disabled: true
- id: plan-mode
  disabled: true
- id: tool-todo
  disabled: true
- id: tool-ralph
  disabled: true

# --- subagents / workflows ---
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true

# --- tool-call support machinery (no tools -> not needed) ---
# - id: timeout-policy  (kept: harmless, consulted only when tools exist)
# - id: approval        (kept: dsh-permission-presets depends on its service;
#                        with zero tools nothing can ever request approval)
# - id: shell-env       (kept: permission-presets depends on the shell service;
#                        it only captures env vars and registers no tool)
- id: spill-local
  disabled: true
- id: spill-policy
  disabled: true
- id: tool-result-pruner
  disabled: true
- id: repeat-tool-reminder
  disabled: true
- id: user-questions
  disabled: true

# --- history rewriting (would destabilise group-A prefix trend) ---
- id: compaction-basic
  disabled: true
- id: session-checkpoint-policy
  disabled: true

# --- session titles (session-title-llm is already off upstream; keep the
#     fallback-only title plugin off too so nothing extra runs per call) ---
- id: session-title
  disabled: true
- id: session-title-llm
  disabled: true

# dsh-permission-presets waits for the "shell" service, which only the shell
# tool plugins provide; with all tools disabled the presets are dead weight,
# so the permission plugin itself is disabled here.
- id: permission
  disabled: true

# --- telemetry / logging upload channels (plan P0.2 requires explicit off) ---
- id: session-telemetry-otel
  disabled: true
- id: session-log-deepseek
  disabled: true
