# Phase 1 task-execution profile patch (FUTURE live pilot only; not used by
# the offline pipeline). Minimal privilege: filesystem tools scoped by the
# harness sandbox to the per-task mounted workspace; NO shell, NO web, NO
# subagents/workflows/skills, NO telemetry/session-log upload.
# Rationale: candidate code execution happens only inside the Docker executor
# (judge-side), never through a host shell tool. The model edits files only.
#
# Still enabled on purpose: tool-fs, tool-fs-search, fs-sandbox,
# sandbox-policy (workspace-write), approval (policy ask), timeout-policy.
# DSH_PERMISSION_MODE is pinned to workspace-write by the runner env.

- id: tool-pwsh
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-jobs
  disabled: true
- id: pwsh-sandbox
  disabled: true
- id: bash-sandbox
  disabled: true
# subprocess stays ENABLED: dsh-tool-fs-search needs its service to spawn the
# bundled ripgrep sidecar; it registers no model-facing tool. pwsh/bash
# sandbox+tools above remain disabled, so no shell reaches the model.
# permission-presets waits for the "shell" service that only shell tool
# plugins provide; with shell tools disabled it can never activate, so the
# permission plugin itself is disabled (approval with policy=ask stays on).
- id: permission
  disabled: true

# --- web ---
- id: tool-web
